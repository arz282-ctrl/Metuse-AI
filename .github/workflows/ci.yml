name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, "feat/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-quality-and-tests:
    name: Python Lint, Typecheck, Unit Tests & Migration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Formatting check (ruff format)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Static type check (mypy --strict)
        run: uv run mypy apps packages database tests

      - name: Unit tests (pytest)
        run: uv run pytest tests/unit -v

      - name: Verify Alembic migration graph has single head
        run: |
          HEADS=$(uv run alembic heads | wc -l | tr -d ' ')
          echo "Alembic head count: $HEADS"
          test "$HEADS" -eq 1

  postgres-rls-integration:
    name: PostgreSQL 16 FORCE RLS & Tenancy Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metuse
          POSTGRES_PASSWORD: ci-owner-password
          POSTGRES_DB: metuse
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U metuse -d metuse"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://metuse:ci-owner-password@localhost:5433/metuse
      APP_DATABASE_URL: postgresql://metuse_app:change-me-app@localhost:5433/metuse
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --frozen

      - name: Apply Alembic migrations (upgrade + downgrade + re-upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run live PostgreSQL RLS & cross-tenant isolation tests
        run: uv run pytest tests/integration -v

  web-quality-and-build:
    name: Web Lint, Typecheck & Production Static Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Typecheck (TypeScript)
        run: pnpm typecheck

      - name: Production build (Next.js static export for Cloudflare Pages)
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: pnpm build
