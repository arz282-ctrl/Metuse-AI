[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "metuse-ai"
version = "0.1.0"
description = "Metuse AI — Tenant-aware social growth and media operations platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14.0,<2.0",
  "boto3>=1.35.0,<2.0",
  "fastapi>=0.115.0,<1.0",
  "httpx>=0.27.0,<1.0",
  "psycopg[binary]>=3.2.3,<4.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "pyjwt[crypto]>=2.10.0,<3.0",
  "redis>=5.2.0,<6.0",
  "sentry-sdk>=3.0.1,<4.0",
  "sqlalchemy>=2.0.36,<3.0",
  "uvicorn[standard]>=0.32.0,<1.0",
]

[dependency-groups]
dev = [
  "boto3-stubs[s3]>=1.35.0",
  "mypy>=1.13.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages", "database", "workers"]
exclude = [
  "apps/web",
  "apps/web/**",
  "**/node_modules/**",
  "**/.next/**",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
  ".venv",
  "apps/web",
  "implementation.md",
  "node_modules",
  ".next",
  "tests/e2e",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"database/seeds/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
mypy_path = "."
plugins = ["pydantic.mypy"]
exclude = [
  "^apps/web/",
  "^tests/e2e/",
  "^node_modules/",
]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit", "tests/integration"]
markers = [
  "unit: Pure unit tests without external services",
  "integration: Live PostgreSQL integration, RLS, and trigger tests",
]
