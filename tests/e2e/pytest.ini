[pytest]
testpaths = .
addopts = -v --strict-markers
markers =
    tier1: Tier 1 — Core functional & smoke tests across all 10 Phase 1 features
    tier2: Tier 2 — Negative, boundary, RLS, RBAC, storage security & secret-scan tests
    tier3: Tier 3 — Pairwise combinatorial interaction tests across dimensions
    tier4: Tier 4 — Full real-world end-to-end application workload scenarios
